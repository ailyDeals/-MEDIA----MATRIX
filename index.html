<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>​🪙 GOLD-MINE BD 🪙 </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #0f172a; color: #f8fafc; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .gold-gradient { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); }
        .nav-active { color: #fbbf24; transform: translateY(-5px); }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #notice-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        #live-toast { position: fixed; bottom: 100px; left: 20px; z-index: 1000; display: none; }
    </style>
</head>
<body class="no-scrollbar">

    <div id="notice-modal" class="flex">
        <div class="glass p-8 rounded-[2.5rem] max-w-sm w-full text-center border-amber-500/30 animate__animated animate__zoomIn">
            <div class="w-16 h-16 gold-gradient rounded-full flex items-center justify-center text-white text-2xl mx-auto mb-4 shadow-lg shadow-amber-500/20">
                <i class="fas fa-bullhorn"></i>
            </div>
            <h3 class="text-xl font-black mb-2 text-white">Official Notice</h3>
            <p id="notice-text" class="text-slate-400 text-sm leading-relaxed mb-6">Loading updates...</p>
            <button onclick="closeNotice()" class="w-full py-4 gold-gradient text-white font-black rounded-2xl shadow-xl">Close</button>
        </div>
    </div>

    <div id="live-toast" class="animate__animated animate__fadeInUp">
        <div class="glass p-3 rounded-2xl flex items-center gap-3 shadow-2xl border-amber-500/30">
            <div class="w-8 h-8 gold-gradient rounded-full flex items-center justify-center text-[10px] text-white"><i class="fas fa-check"></i></div>
            <div>
                <p id="toast-text" class="text-[10px] font-bold text-white"></p>
                <p class="text-[8px] text-amber-500 font-black uppercase tracking-widest">Confirmed</p>
            </div>
        </div>
    </div>

    <section id="auth-page" class="page active min-h-screen flex flex-col items-center justify-center p-6 bg-[#0f172a]">
        <div class="w-20 h-20 gold-gradient rounded-3xl flex items-center justify-center text-white text-4xl mb-6 shadow-2xl">
            <i class="fas fa-gem"></i>
        </div>
        <h1 class="text-4xl font-black mb-10 tracking-tight text-white">​ GOLD-MINE   <span class="text-amber-500"> BD </span></h1>
        <div class="w-full max-w-sm space-y-4">
            <div id="reg-fields" class="hidden"><input id="auth-name" type="text" placeholder="Full Name" class="w-full p-4 mb-4 glass rounded-2xl outline-none border-transparent focus:border-amber-500 text-white"></div>
            <input id="auth-mobile" type="tel" placeholder="Mobile Number" class="w-full p-4 glass rounded-2xl outline-none border-transparent focus:border-amber-500 text-white">
            <input id="auth-pin" type="password" placeholder="4-Digit PIN" maxlength="4" class="w-full p-4 glass rounded-2xl outline-none border-transparent focus:border-amber-500 text-white">
            <button onclick="handleAuth()" id="auth-btn" class="w-full gold-gradient text-white font-black py-4 rounded-2xl shadow-lg">Login</button>
            <p id="switch-auth" class="text-center text-xs text-slate-500 mt-6 cursor-pointer" onclick="toggleAuthMode()">New here? <span class="text-amber-500 font-bold">Register Now</span></p>
        </div>
    </section>

    <main id="main-app" class="hidden min-h-screen pb-28">
        <header class="glass p-5 sticky top-0 z-50 flex justify-between items-center border-b border-slate-800">
            <div><p class="text-[10px] font-bold text-slate-200 uppercase tracking-widest">Balance</p><h2 class="text-2xl font-black text-amber-200">৳ <span id="balance-display">0.00</span></h2></div>
            <div class="text-right"><p id="user-id-badge" class="font-black text-[10px] bg-amber-200/10 text-amber-200 px-3 py-1 rounded-full border border-amber-200/20">ID-XXXX</p></div>
        </header>

        <div id="home" class="page p-5">
            <div class="glass rounded-[2rem] p-6 mb-8 relative">
                <p class="text-slate-400 text-xs font-bold uppercase mb-1">Total Profits</p>
                <h3 class="text-4xl font-black text-white mb-6">৳ <span id="profit-display">0.00</span></h3>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-white/5 p-4 rounded-2xl border border-white/10"><p class="text-[9px] text-slate-200 font-bold uppercase">Invested</p><p class="font-black text-amber-500">৳ <span id="invested-display">0.00</span></p></div>
                    <div class="bg-white/5 p-4 rounded-2xl border border-white/10"><p class="text-[9px] text-slate-200 font-bold uppercase">Rank</p><p class="font-black text-green-500 uppercase text-[9px]">​🪙 GOLD-MINE BD 🪙</p></div>
                </div>
            </div>
            <h4 class="font-black text-lg mb-4 flex items-center gap-2"><i class="fas fa-fire text-amber-200"></i> Active Mining Nodes</h4>
            <div id="plans-container" class="space-y-4"></div>
        </div>

        <div id="portfolio" class="page p-5">
            <h3 class="text-2xl font-black mb-6">Active Mining</h3>
            <div id="portfolio-list" class="space-y-4"></div>
        </div>

        <div id="deposit" class="page p-5">
            <h3 class="text-2xl font-black mb-4">Recharge</h3>
            <div class="flex gap-2 mb-4"><button onclick="setMethod('bKash')" id="m-bkash" class="flex-1 p-4 glass rounded-2xl text-xs font-black border border-slate-700">bKash</button><button onclick="setMethod('Nagad')" id="m-nagad" class="flex-1 p-4 glass rounded-2xl text-xs font-black border border-slate-700">Nagad</button></div>
            <div class="glass p-6 rounded-[2rem] space-y-4">
                <div class="p-4 bg-slate-900 border border-slate-700 rounded-2xl flex justify-between items-center">
                    <div><p id="method-title" class="text-[10px] font-bold text-slate-200">Receiver Number</p><input id="admin-number" value="Select Method" readonly class="bg-transparent font-black text-amber-500 outline-none w-full"></div>
                    <button onclick="copyNumber()" class="bg-amber-200 text-white px-4 py-2 rounded-xl text-[10px] font-black">COPY</button>
                </div
                <input id="dep-amt" type="number" placeholder="Amount (Min 200)" class="w-full p-4 glass rounded-2xl outline-none font-bold text-white border-slate-700">
                <input id="dep-tx" type="text" placeholder="TrxID (Transaction ID)" class="w-full p-4 glass rounded-2xl outline-none font-bold text-white border-slate-700">
                <button onclick="requestDeposit()" class="w-full py-4 gold-gradient text-white font-black rounded-2xl">Deposit Now</button>
            </div>
        </div>

        <div id="profile" class="page p-5">
            <div class="glass p-6 rounded-[2rem] text-center mb-6"><h2 id="u-name" class="text-xl font-black text-amber-500">User</h2><p id="u-phone" class="text-[10px] text-slate-500 font-bold uppercase">Member</p></div>
            
            <div class="grid grid-cols-2 gap-4 mb-6">
                <a href="#" id="tg-link" target="_blank" class="glass p-4 rounded-2xl flex flex-col items-center gap-2 border-blue-200/20"><i class="fab fa-telegram text-2xl text-blue-400"></i><span class="text-[10px] font-black uppercase">Telegram</span></a>
                <a href="#" id="wa-link" target="_blank" class="glass p-4 rounded-2xl flex flex-col items-center gap-2 border-green-200/20"><i class="fab fa-whatsapp text-2xl text-green-400"></i><span class="text-[10px] font-black uppercase">Support</span></a>
            </div>

            <div class="glass p-6 rounded-[2rem] space-y-4">
                <h4 class="font-black text-white">Withdrawal</h4>
                <input id="w-amt" type="number" placeholder="Min 600" class="w-full p-4 glass rounded-2xl outline-none border-slate-700 text-white">
                <input id="w-num" type="tel" placeholder="Receiver Number" class="w-full p-4 glass rounded-2xl outline-none border-slate-700 text-white">
                <button onclick="requestWithdraw()" class="w-full py-4 bg-white text-slate-900 font-black rounded-2xl">Cash Out</button>
            </div>
            <div id="withdraw-status-list" class="space-y-3 mt-6"></div>
            <button onclick="logout()" class="w-full py-4 text-rose-200 font-bold glass rounded-2xl mt-10">Logout</button>
        </div>

        <nav class="fixed bottom-0 left-0 right-0 glass border-t border-slate-800 flex justify-around p-4 z-50 rounded-t-3xl">
            <button onclick="navigate('home')" class="nav-btn p-3 nav-active" data-page="home"><i class="fas fa-home text-xl"></i></button>
            <button onclick="navigate('portfolio')" class="nav-btn p-3 text-slate-200" data-page="portfolio"><i class="fas fa-chart-pie text-xl"></i></button>
            <button onclick="navigate('deposit')" class="nav-btn p-3 text-slate-200" data-page="deposit"><i class="fas fa-wallet text-xl"></i></button>
            <button onclick="navigate('profile')" class="nav-btn p-3 text-slate-200" data-page="profile"><i class="fas fa-user-circle text-xl"></i></button>
        </nav>
    </main>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDXD_ANF89k7StmGJ1Xz55nGUOB3ajMoF4", authDomain: "smartinvestpro-c659f.firebaseapp.com", databaseURL: "https://smartinvestpro-c659f-default-rtdb.firebaseio.com", projectId: "smartinvestpro-c659f", storageBucket: "smartinvestpro-c659f.firebasestorage.app", messagingSenderId: "294616388438", appId: "1:294616388438:web:54250014b8625fb50c3cf7" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let state = null;
        let isLoginMode = true;

        function closeNotice() { document.getElementById('notice-modal').style.display = 'none'; }
        
        function toggleAuthMode() { 
            isLoginMode = !isLoginMode; 
            document.getElementById('reg-fields').classList.toggle('hidden');
            document.getElementById('auth-btn').innerText = isLoginMode ? "Login" : "Register";
            document.getElementById('switch-auth').innerHTML = isLoginMode ? "New here? <span class='text-amber-500 font-bold'>Register Now</span>" : "Have account? <span class='text-amber-500 font-bold'>Login</span>";
        }

        window.onload = async () => {
            const savedPhone = localStorage.getItem('logged_phone');
            if(savedPhone) {
                const snap = await db.ref('users/' + savedPhone).once('value');
                if(snap.exists()){ state = snap.val(); loginSuccess(); }
            }
        };

        async function handleAuth() {
            const mobile = document.getElementById('auth-mobile').value;
            const pin = document.getElementById('auth-pin').value;
            if(!isLoginMode) {
                const name = document.getElementById('auth-name').value;
                if(!name || mobile.length < 10) return alert("Valid Details Required");
                state = { name, phone: mobile, pin, userId: 'ID-'+Math.floor(1000+Math.random()*9000), balance: 0, invested: 0, profit: 0, myPlans: [], lastClaim: Date.now() };
                await db.ref('users/' + mobile).set(state);
            } else {
                const snap = await db.ref('users/' + mobile).once('value');
                if(!snap.exists() || snap.val().pin !== pin) return alert("Wrong Credentials");
                state = snap.val();
            }
            localStorage.setItem('logged_phone', mobile);
            loginSuccess();
        }

        function loginSuccess() {
            document.getElementById('auth-page').style.display = 'none';
            document.getElementById('main-app').classList.remove('hidden');
            
            db.ref('users/' + state.phone).on('value', snap => { 
                state = snap.val(); 
                refreshUI(); 
                checkAutoProfit(); 
            });

            // Admin Logic: Notice, Plans, Links
            db.ref('appSettings').on('value', s => {
                const data = s.val() || {};
                document.getElementById('notice-text').innerText = data.notice || "Welcome!";
                document.getElementById('notice-modal').style.display = 'flex';
                document.getElementById('tg-link').href = data.telegram || "#";
                document.getElementById('wa-link').href = "https://wa.me/" + (data.whatsapp || "");
            });

            navigate('home');
        }

        async function checkAutoProfit() {
            if (!state.myPlans || state.myPlans.length === 0) return;
            const now = Date.now();
            const lastClaim = state.lastClaim || 0;
            const oneDay = 24 * 60 * 60 * 1000;

            if (now - lastClaim >= oneDay) {
                let dailyTotal = 0;
                state.myPlans.forEach(p => dailyTotal += p.daily);
                if (dailyTotal > 0) {
                    await db.ref('users/' + state.phone).update({
                        balance: (state.balance || 0) + dailyTotal,
                        profit: (state.profit || 0) + dailyTotal,
                        lastClaim: now
                    });
                }
            }
        }

        function refreshUI() {
            document.getElementById('balance-display').innerText = (state.balance || 0).toFixed(2);
            document.getElementById('profit-display').innerText = (state.profit || 0).toFixed(2);
            document.getElementById('invested-display').innerText = (state.invested || 0).toFixed(2);
            document.getElementById('user-id-badge').innerText = state.userId;
            document.getElementById('u-name').innerText = state.name;
            document.getElementById('u-phone').innerText = state.phone;
            renderPortfolio(); renderWithdrawStatus();
        }

        // DYNAMIC PLANS FROM ADMIN
        function renderPlans() {
            db.ref('appPlans').once('value', snap => {
                let html = '';
                snap.forEach(child => {
                    const p = child.val();
                    html += `
                    <div class="glass p-5 rounded-[2rem] flex flex-col gap-4 border-slate-800">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 bg-amber-200/10 rounded-2xl flex items-center justify-center text-2xl">${p.icon}</div>
                                <div><h4 class="font-black text-white text-sm">${p.title}</h4><p class="text-[9px] text-slate-200 uppercase">Validity: ${p.days} Days</p></div>
                            </div>
                            <div class="text-right"><p class="text-[9px] text-green-500 font-black uppercase">Daily Profit</p><p class="text-white font-black">৳${p.daily}</p></div>
                        </div>
                        <button onclick="buyPlan('${child.key}')" class="w-full gold-gradient text-white py-3 rounded-2xl text-xs font-black shadow-lg">Purchase for ৳${p.price}</button>
                    </div>`;
                });
                document.getElementById('plans-container').innerHTML = html || "<p class='text-center opacity-20 py-10'>No Plans Available</p>";
            });
        }

        async function buyPlan(planKey) {
            const pSnap = await db.ref('appPlans/' + planKey).once('value');
            const p = pSnap.val();
            if(state.balance >= p.price) {
                const myPlans = state.myPlans || [];
                myPlans.push({ title: p.title, daily: p.daily, price: p.price, date: new Date().toLocaleDateString(), icon: p.icon });
                await db.ref('users/' + state.phone).update({ balance: state.balance - p.price, invested: (state.invested || 0) + p.price, myPlans: myPlans });
                alert("Mining Activated!"); navigate('portfolio');
            } else { alert("Insufficient Balance!"); navigate('deposit'); }
        }

        function renderPortfolio() {
            const list = state.myPlans || [];
            document.getElementById('portfolio-list').innerHTML = list.map(i => `
                <div class="glass p-4 rounded-3xl border-slate-800 flex justify-between items-center">
                    <div class="flex items-center gap-3"><span class="text-2xl">${i.icon}</span>
                        <div><h4 class="font-black text-white text-sm">${i.title}</h4><p class="text-[8px] text-slate-200 uppercase">Running</p></div>
                    </div>
                    <div class="text-green-200 font-black text-[9px] uppercase tracking-widest">Active Node</div>
                </div>`).join('') || "<p class='text-center py-20 opacity-20 text-[9px]'>Nodes Offline</p>";
        }

        function navigate(pId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pId).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('nav-active', 'text-slate-200'));
            const btn = document.querySelector(`[data-page="${pId}"]`);
            if(btn) btn.classList.replace('text-slate-200', 'nav-active');
            if(pId === 'home') renderPlans();
        }

        function setMethod(m) {
            document.getElementById('m-bkash').className = 'flex-1 p-4 glass rounded-2xl text-xs font-black border border-slate-700';
            document.getElementById('m-nagad').className = 'flex-1 p-4 glass rounded-2xl text-xs font-black border border-slate-700';
            document.getElementById('m-'+m.toLowerCase()).classList.add('bg-amber-200');
            db.ref('appSettings').once('value', s => { document.getElementById('admin-number').value = s.val()[m.toLowerCase()] || '01XXXXXXXXX'; });
            window.currentMethod = m;
        }

        function copyNumber() { navigator.clipboard.writeText(document.getElementById('admin-number').value); alert("Copied!"); }
        async function requestDeposit() {
            const amt = parseFloat(document.getElementById('dep-amt').value);
            const tx = document.getElementById('dep-tx').value;
            if(!window.currentMethod || amt < 200) return alert("Min 200 & Select Method");
            await db.ref('requests/deposits').push({ phone: state.phone, name: state.name, amount: amt, tx: tx, method: window.currentMethod, status: 'Pending', date: new Date().toLocaleString() });
            alert("Submitted!"); navigate('home');
        }

        async function requestWithdraw() {
            const amt = parseFloat(document.getElementById('w-amt').value);
            const num = document.getElementById('w-num').value;
            if(amt >= 600 && amt <= state.balance) {
                const withdraws = state.withdraws || [];
                withdraws.push({ amount: amt, status: 'Pending', date: new Date().toLocaleDateString() });
                await db.ref('requests/withdraws').push({ phone: state.phone, amount: amt, receiver: num, status: 'Pending' });
                await db.ref('users/' + state.phone).update({ balance: state.balance - amt, withdraws: withdraws });
                alert("Withdraw Request Sent!");
            } else { alert("Min 600 or Low Balance!"); }
        }

        function renderWithdrawStatus() {
            const list = state.withdraws || [];
            document.getElementById('withdraw-status-list').innerHTML = list.map(w => `<div class="glass p-4 rounded-2xl flex justify-between items-center text-[10px] font-bold"><span>৳${w.amount}</span><span class="text-amber-500">${w.status}</span></div>`).join('');
        }
        function logout() { localStorage.clear(); location.reload(); }

        // Live Toast Random Data
        setInterval(() => {
            const toast = document.getElementById('live-toast');
            const userNames = ["Zakir", "Mitu", "Faruk", "Nipa", "Rashed", "Alvi", "Sumon"];
            document.getElementById('toast-text').innerText = `${userNames[Math.floor(Math.random()*userNames.length)]}*** deposited ৳${[500,2000,5000][Math.floor(Math.random()*3)]}`;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }, 15000);
    </script>
</body>
</html>
